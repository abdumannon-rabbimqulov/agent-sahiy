services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahiy
      POSTGRES_PASSWORD: sahiy
      POSTGRES_DB: sahiy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahiy -d sahiy"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    # Konteyner ichidan hostdagi Ollama'ga borish uchun (localhost ishlamaydi).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgres://sahiy:sahiy@db:5432/sahiy?sslmode=disable
      # Lokal model hostda ishlaydi — konteynerdan shu manzil orqali ko'rinadi.
      OLLAMA_URL: http://host.docker.internal:11434
      DATA_DIR: /data
      # Sessiya /data volume'da saqlanadi — bir marta login qilinsa yetadi.
      TG_SESSION: /data/tg-session.json
    volumes:
      - agentdata:/data
    ports:
      - "${WEB_PORT:-8080}:8080"

volumes:
  pgdata:
  agentdata:

# Birinchi (va yagona) Telegram login:
#   docker compose run --rm agent login
#
# Promptlar Postgres'da yashaydi va dashboarddan tahrirlanadi: /prompts
