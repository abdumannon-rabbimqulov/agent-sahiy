<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kategoriyalar — Sahiy AI Agent</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
  <h1>📚 Kategoriyalar</h1>
  <div class="sub">Agent javob berishda ishlatadigan bilim bo'limlari. Mijoz savoliga mos
    kategoriya AI tomonidan tanlanib, matni promptga qo'shiladi.</div>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/categories" class="on">Kategoriyalar</a>
    <a href="/prompts">Promptlar</a>
  </nav>
</header>
<div class="wrap">
  <form class="box" id="form">
    <input type="hidden" id="id">
    <div>
      <label for="name">Nomi</label>
      <input type="text" id="name" placeholder="Yetkazib berish" required>
    </div>
    <div>
      <label for="description">Qisqa izoh (AI shu bo'yicha kategoriyani tanlaydi)</label>
      <input type="text" id="description" placeholder="yetkazib berish, punktlar, muddat, narx">
    </div>
    <div>
      <label for="content">Ma'lumot (promptga shu matn qo'shiladi)</label>
      <textarea id="content" placeholder="- Toshkent shahriga uyingizgacha bepul yetkaziladi..." required></textarea>
    </div>
    <div class="row">
      <label style="margin:0"><input type="checkbox" id="active" checked> Aktiv</label>
      <button type="submit" id="submitBtn">Qo'shish</button>
      <button type="button" class="ghost" id="cancelBtn" hidden>Bekor qilish</button>
      <span class="err" id="err"></span>
    </div>
  </form>

  <h3>Ro'yxat</h3>
  <table>
    <thead><tr><th>ID</th><th>Nomi</th><th>Ma'lumot</th><th>Holat</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script src="/static/categories.js"></script>
</body>
</html>
