server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA — hash router ishlatilsa ham, to'g'ridan-to'g'ri kirishlar uchun.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend shu konteyner tarmog'ida "api" nomi bilan ko'rinadi.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
